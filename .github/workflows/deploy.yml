name: CI Pipeline

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install basic deps
        run: |
          python -m pip install --upgrade pip

      - name: Run simple check
        run: |
          python -c "print('CI WORKING 🚀')"
