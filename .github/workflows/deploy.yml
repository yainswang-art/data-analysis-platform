name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. 拉代码
      - name: Checkout code
        uses: actions/checkout@v3

      # 2. 设置 Python
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      # 3. 安装依赖
      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      # 4. 基础代码检查
      - name: Run sanity check
        run: |
          python -c "import src.cleaner; import src.analyzer; print('OK')"

      # 5. Docker build（关键）
      - name: Build Docker image
        run: |
          docker build -t data-analysis-platform .
